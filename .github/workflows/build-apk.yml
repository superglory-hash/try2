name: Build Seoul Radio Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          if [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug --no-daemon
          elif [ -f "SeoulRadioAndroid/settings.gradle.kts" ]; then
            cd SeoulRadioAndroid && gradle assembleDebug --no-daemon
          else
            PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle.kts' | head -n 1)")
            cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon
          fi

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seoul-radio-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
